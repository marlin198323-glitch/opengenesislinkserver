; NexVerse CI-only LLLogin protocol smoke-test configuration.
; Starts the real LLLoginServiceInConnector with in-memory Null account/auth storage.

[Const]
    PublicPort = "19092"
    PrivatePort = "19093"

[Startup]
    RegistryLocation = "."
    ConfigDirectory = "robust-include"
    console = "mock"
    ConsoleHistoryFileEnabled = false

[ServiceList]
    LLLoginServiceInConnector = "${Const|PublicPort}/OpenSim.Server.Handlers.dll:LLLoginServiceInConnector"
    GridInfoServerInConnector = "${Const|PublicPort}/OpenSim.Server.Handlers.dll:GridInfoServerInConnector"

[GridInfoService]
    gridname = "OGL CI Grid"
    gridnick = "OGLCI"
    login = "http://127.0.0.1:19092/"
    home = "http://127.0.0.1:19092/"
    gatekeeper = "http://127.0.0.1:19092/"
    website = "https://example.org/"
    ; Never echo arbitrary GridInfoService keys in the new OGL JSON API.
    internal_test_secret = "must-never-appear-in-ogl-discovery"

[Network]
    port = ${Const|PrivatePort}
    AllowllHTTPRequestIn = false

[DatabaseService]
    StorageProvider = "OpenSim.Data.Null.dll"
    ConnectionString = ""

[AuthenticationService]
    LocalServiceModule = "OpenSim.Services.AuthenticationService.dll:PasswordAuthenticationService"
    StorageProvider = "OpenSim.Data.Null.dll"
    ConnectionString = ""

[UserAccountService]
    LocalServiceModule = "OpenSim.Services.UserAccountService.dll:UserAccountService"
    StorageProvider = "OpenSim.Data.Null.dll"
    ConnectionString = ""

[GridUserService]
    LocalServiceModule = "OpenSim.Services.UserAccountService.dll:GridUserService"
    StorageProvider = "OpenSim.Data.Null.dll"
    ConnectionString = ""

[LoginService]
    ; NexVerse resident-name compatibility:
    ; Jam, jam.resident and Jam Resident resolve to the same account.
    EnableNexVerseResidentNames = true

    LocalServiceModule = "OpenSim.Services.LLLoginService.dll:LLLoginService"
    UserAccountService = "OpenSim.Services.UserAccountService.dll:UserAccountService"
    GridUserService = "OpenSim.Services.UserAccountService.dll:GridUserService"
    AuthenticationService = "OpenSim.Services.AuthenticationService.dll:PasswordAuthenticationService"

    ; The protocol smoke intentionally submits a non-existent user and therefore
    ; does not require inventory, grid or simulator placement services.
    RequireInventory = false
    WelcomeMessage = "NexVerse CI"
    AllowRemoteSetLoginLevel = false
    DOSMaxRequestsInTimeFrame = 0
