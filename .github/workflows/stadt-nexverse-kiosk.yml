name: Stadt NexVerse Kiosk APK
on:
  push:
    branches:
      - feature/stadt-nexverse-kiosk
    paths:
      - apps/StadtNexVerseKiosk-source.tgz
      - apps/StadtNexVerseKiosk-v1.2.patch
      - .github/workflows/stadt-nexverse-kiosk.yml
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract source bundle
        run: |
          mkdir -p apps
          tar -xzf apps/StadtNexVerseKiosk-source.tgz -C apps
          test -f apps/StadtNexVerseKiosk/app/build.gradle
      - name: Apply v1.2 API dashboard update
        run: |
          cd apps
          sed '/^--- StadtNexVerseKiosk\/README.md$/,$d' StadtNexVerseKiosk-v1.2.patch | patch --batch --fuzz=0 -p0
          grep -F "versionName '1.2.0'" StadtNexVerseKiosk/app/build.gradle
      - name: Assemble debug APK
        working-directory: apps/StadtNexVerseKiosk
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stadt-NexVerse-Live-Kiosk-v1.2.0-APK
          path: apps/StadtNexVerseKiosk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
