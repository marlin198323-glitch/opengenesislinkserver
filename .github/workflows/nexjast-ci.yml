      - name: Verify NexVerse native assemblies
        shell: bash
        run: |
          test -f bin/NexVerse.Core.dll
          test -f bin/NexVerse.Server.Api.dll
          test -f bin/NexVerse.RegionModules.dll

      - name: Runtime smoke test NV dollar Robust bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/opengenesislink-economy-ci.db /tmp/opengenesislink-economy-ci.db-journal /tmp/opengenesislink-economy-ci.db-wal /tmp/opengenesislink-economy-ci.db-shm

          cd bin
          dotnet Robust.dll -inifile Robust.NexEconomy.Tests.ini > ../nexverse-economy-smoke.log 2>&1 &
          ROBUST_PID=$!

          cleanup() {
            kill "$ROBUST_PID" 2>/dev/null || true
            wait "$ROBUST_PID" 2>/dev/null || true
            rm -f /tmp/opengenesislink-economy-ci.db /tmp/opengenesislink-economy-ci.db-journal /tmp/opengenesislink-economy-ci.db-wal /tmp/opengenesislink-economy-ci.db-shm
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 120); do
            if [ -f /tmp/opengenesislink-economy-ci.db ]; then
              if python3 - <<'PY'
          import sqlite3

          path = "/tmp/opengenesislink-economy-ci.db"
          con = sqlite3.connect(path, timeout=1)
          try:
              tables = {
                  row[0]
                  for row in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              required = {
                  "ogl_ledger_schema",
                  "ogl_ledger_accounts",
                  "ogl_ledger_transactions",
                  "ogl_ledger_postings",
                  "ogl_ledger_account_state",
                  "ogl_ledger_account_events",
                  "ogl_ledger_virtual_accounts",
                  "ogl_economy_transfer_policies",
                  "ogl_economy_payment_requests",
                  "ogl_economy_commerce_orders",
                  "ogl_economy_land_listings",
                  "ogl_economy_land_leases",
              }
              assert required.issubset(tables), (required, tables)
              version = con.execute(
                  "SELECT MAX(version) FROM ogl_ledger_schema"
              ).fetchone()[0]
              assert version == 4, version
              assert con.execute(
                  "SELECT COUNT(*) FROM ogl_ledger_accounts"
              ).fetchone()[0] == 0
              assert con.execute(
                  "SELECT COUNT(*) FROM ogl_ledger_transactions"
              ).fetchone()[0] == 0
              assert con.execute(
                  "SELECT COUNT(*) FROM ogl_ledger_postings"
              ).fetchone()[0] == 0
              assert con.execute(
                  "SELECT COUNT(*) FROM ogl_ledger_account_state"
              ).fetchone()[0] == 0
              assert con.execute(
                  "SELECT COUNT(*) FROM ogl_ledger_account_events"
              ).fetchone()[0] == 0
              assert con.execute(
                  "SELECT COUNT(*) FROM ogl_ledger_virtual_accounts"
              ).fetchone()[0] == 0
              for table in (
                  "ogl_economy_transfer_policies",
                  "ogl_economy_payment_requests",
                  "ogl_economy_commerce_orders",
                  "ogl_economy_land_listings",
                  "ogl_economy_land_leases",
              ):
                  assert con.execute(
                      "SELECT COUNT(*) FROM " + table
                  ).fetchone()[0] == 0
          finally:
              con.close()
          PY
              then
