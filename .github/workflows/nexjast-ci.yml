              "/api/v1/experiences/script/details": ("get",),
              "/api/v1/experiences/script/permission": ("get",),
              "/api/v1/experiences/script/location": ("get",),
              "/api/v1/experiences/script/kv": ("post",),
              "/api/v1/experiences/viewer/permissions": ("get", "put"),
              "/api/v1/experiences/viewer/group": ("get",),
              "/api/v1/experiences/viewer/manage": ("post", "put"),
          }.items():
              for method in methods:
                  assert method in doc["paths"][experience_path], (experience_path, method)
          viewer = doc["paths"]["/api/v1/experiences/viewer/permissions"]
          assert viewer["put"]["x-nexverse-scope"] == "experiences:viewer:permissions"
          manager = doc["paths"]["/api/v1/experiences/viewer/manage"]
          for method, schema, result_code in (
              ("post", "ExperienceViewerAcquireRequest", "201"),
              ("put", "ExperienceViewerProfileRequest", "200"),
          ):
              operation = manager[method]
              assert operation["x-nexverse-audience"] == ["service"]
              assert operation["x-nexverse-scope"] == "experiences:viewer:manage"
              assert operation["security"] == [{"apiKeyAuth": []}]
              assert operation["requestBody"]["content"]["application/json"]["schema"]["$ref"] == (
                  "#/components/schemas/" + schema)
              assert operation["responses"][result_code]["content"]["application/json"]["schema"]["$ref"] == (
                  "#/components/schemas/ExperienceViewerManageResponse")
          assert schemas["ExperienceViewerAcquireRequest"]["required"] == ["owner_id"]
          assert "experience_id" in schemas["ExperienceViewerProfileRequest"]["required"]
          assert viewer["put"]["x-nexverse-audience"] == ["service"]
          assert viewer["put"]["security"] == [{"apiKeyAuth": []}]
          assert viewer["put"]["requestBody"]["content"]["application/json"]["schema"]["$ref"] == (
              "#/components/schemas/ExperienceViewerDecisionRequest")
          assert viewer["get"]["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == (
              "#/components/schemas/ExperienceViewerPermissionReadResponse")
          assert {p["name"] for p in viewer["get"]["parameters"]} == {
              "resident_id", "experience_id"}
          assert "oneOf" in schemas["ExperienceViewerPermissionReadResponse"]
          assert doc["paths"]["/api/v1/experiences/script/kv"]["post"]["requestBody"][
              "content"]["application/json"]["schema"]["$ref"] == (
              "#/components/schemas/ExperienceKvRequest")
          assert doc["paths"]["/api/v1/experiences/script/info"]["get"]["responses"]["200"][
              "content"]["application/json"]["schema"]["$ref"] == (
              "#/components/schemas/ExperiencePublicInfoResponse")
          assert "check_original" in schemas["ExperienceKvRequest"]["properties"]
          assert doc["x_nexverse_version_history"][0]["status"] == "release"
          for path, required_methods in {
              "/api/v1/profiles/{principalId}/image": ("get",),
              "/api/v1/events/{eventId}": ("get", "patch", "delete"),
              "/api/v1/classifieds/{classifiedId}": ("get", "patch", "delete"),
              "/api/v1/groups/mine": ("get",),
          }.items():
              for method in required_methods:
                  assert method in doc["paths"][path], (path, method)
          profile_image = doc["paths"]["/api/v1/profiles/{principalId}/image"]["get"]
          assert "image/png" in profile_image["responses"]["200"]["content"]
          assert profile_image["responses"]["200"]["content"]["image/png"]["schema"]["format"] == "binary"
          assert doc["paths"]["/api/v1/events/{eventId}"]["patch"]["x-nexverse-scope"] == "discovery:manage"
          assert doc["paths"]["/api/v1/groups/mine"]["get"]["x-nexverse-scope"] == "groups:read"
          assert doc["paths"]["/api/v1/events/{eventId}"]["patch"]["requestBody"][
              "content"]["application/json"]["schema"]["$ref"] == (
              "#/components/schemas/DiscoveryEventPatch")
          assert doc["paths"]["/api/v1/classifieds/{classifiedId}"]["patch"]["requestBody"][
              "content"]["application/json"]["schema"]["$ref"] == (
              "#/components/schemas/DiscoveryClassifiedPatch")
          assert "/api/v1/chatgpt-instructions.md" in doc["paths"]
          assert "/api/v1/chatgpt-buergerportal.md" in doc["paths"]
          assert "/api/v1/chatgpt-admin.md" in doc["paths"]
          assert "x-nexverse-ai-instruction" in doc["paths"]["/api/v1/users"]["post"]
          assert "x-nexverse-security-constraints" in doc["paths"]["/api/v1/users"]["post"]
          print("NexVerse OpenAPI 3.1 schema contract smoke: OK")
          PY

          STATS_STATUS=$(curl --silent --max-time 2 -o /tmp/nexverse-statistics.json -w '%{http_code}' http://127.0.0.1:19090/api/v1/statistics/summary)
          test "$STATS_STATUS" = "503"
          grep -F '"error": "statistics_data_unavailable"' /tmp/nexverse-statistics.json
          if [ "$STATS_STATUS" = "404" ]; then
            echo "::error::Statistics route disappeared while privileged endpoints are disabled."
            exit 1
          fi

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/docs > /tmp/nexverse-api-docs.html
          grep -F 'OpenGenesisLINK – Control Center' /tmp/nexverse-api-docs.html
          # Same-path POST must reach the dedicated auth handler, never return
          # the HTML login shell with a misleading HTTP 200. This synthetic
          # smoke runs in public-only mode, so real admin login is disabled.
          DOCS_LOGIN_STATUS="$(curl --silent --max-time 3 --output /tmp/ogl-docs-login.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"username":"ci-user","password":"not-a-real-password"}' \
            http://127.0.0.1:19090/api/v1/docs)"
          test "$DOCS_LOGIN_STATUS" = 503
          grep -F '"error":"admin_login_unavailable"' /tmp/ogl-docs-login.json
          # Full Control Center HTML must never be returned without a
          # server-verified local administrator token, regardless of UI scripts.
          DOCS_STATUS="$(curl --silent --output /tmp/ogl-docs-denied.txt --write-out '%{http_code}' --max-time 3 http://127.0.0.1:19090/api/v1/docs/panel)"
          test "$DOCS_STATUS" = 401
          if grep -F 'id="page-explorer"' /tmp/ogl-docs-denied.txt; then
            echo "::error::Protected OGL admin HTML was exposed anonymously"
            exit 1
          fi
          # The full dashboard is protected and cannot be downloaded anonymously.
          # Verify retained explorer/grid functions in its compiled HTML source.
          DOCS_SOURCE=../NexVerse/Server/Api/NexApiDocsPage.cs
          grep -F 'Was ist neu?' $DOCS_SOURCE
          grep -F 'OpenGenesisLINK Entwicklungsplan' $DOCS_SOURCE
          grep -F 'Was ist neu?' $DOCS_SOURCE
          grep -F 'OpenGenesisLINK Entwicklungsplan' $DOCS_SOURCE
          grep -F 'x_nexverse_changelog' $DOCS_SOURCE
          grep -F 'x_nexverse_roadmap' $DOCS_SOURCE
          grep -F '/api/v1/openapi.json' $DOCS_SOURCE
          grep -F 'ChatGPT / Portale' $DOCS_SOURCE
          grep -F '/api/v1/chatgpt-instructions.md' $DOCS_SOURCE
          grep -F '/api/v1/chatgpt-buergerportal.md' $DOCS_SOURCE
          grep -F '/api/v1/chatgpt-admin.md' $DOCS_SOURCE
          grep -F 'data-audience-target="citizen"' $DOCS_SOURCE
          grep -F 'data-endpoint-audience="admin"' $DOCS_SOURCE
          grep -F 'Interaktiver Grid-Planer' $DOCS_SOURCE
          grep -F '/api/v1/grid/layout' $DOCS_SOURCE
          grep -F '/api/v1/grid/validate-placement' $DOCS_SOURCE
          grep -F 'regions:read' $DOCS_SOURCE
          grep -F 'Simulator-Nodes' $DOCS_SOURCE
          grep -F '/api/v1/nodes' $DOCS_SOURCE
          grep -F 'simulators:read' $DOCS_SOURCE
          grep -F 'Region erstellen' $DOCS_SOURCE
          grep -F 'createGridRegion' $DOCS_SOURCE
          grep -F 'moveGridRegion' $DOCS_SOURCE
          grep -F 'gridRegionSearch' $DOCS_SOURCE
          grep -F 'jumpGridRegion' $DOCS_SOURCE
          grep -F 'startGridRegion' $DOCS_SOURCE
          grep -F 'stopGridRegion' $DOCS_SOURCE
          grep -F 'restartGridRegion' $DOCS_SOURCE
          grep -F 'loadGridEstates' $DOCS_SOURCE
          grep -F 'gridEstateOptions' $DOCS_SOURCE
          grep -F 'loadEstateManagement' $DOCS_SOURCE
          grep -F 'createEstateManagement' $DOCS_SOURCE
          grep -F 'updateEstateManagement' $DOCS_SOURCE
          grep -F 'assignEstateRegion' $DOCS_SOURCE
          grep -F 'estates:read' $DOCS_SOURCE
          grep -F 'estates:manage' $DOCS_SOURCE
          grep -F '/api/v1/estates' $DOCS_SOURCE
          grep -F '/api/v1/regions/' $DOCS_SOURCE
          grep -F '/lifecycle' $DOCS_SOURCE
          grep -F '/api/v1/region-operations/' $DOCS_SOURCE
          if grep -F 'localStorage' /tmp/nexverse-api-docs.html || grep -F 'localStorage' "$DOCS_SOURCE"; then
            echo "::error::API Control Center must not persist credentials in localStorage."
            exit 1
          fi

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/chatgpt-instructions.md > /tmp/nexverse-chatgpt.md
          grep -F 'OpenGenesisLINK World API - ChatGPT Gesamtanweisung' /tmp/nexverse-chatgpt.md
          grep -F 'Buergerportal / Einwohner-Selbstbedienung' /tmp/nexverse-chatgpt.md
          grep -F '## Adminbereich' /tmp/nexverse-chatgpt.md
          grep -F '/api/v1/openapi.json' /tmp/nexverse-chatgpt.md
          grep -F 'experiences:viewer:permissions' /tmp/nexverse-chatgpt.md
          grep -F 'experiences:viewer:manage' /tmp/nexverse-chatgpt.md
          grep -F 'Script-/Service-Integrationen' /tmp/nexverse-chatgpt.md

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/chatgpt-buergerportal.md > /tmp/nexverse-chatgpt-citizen.md
          grep -F 'ChatGPT Anweisung Buergerportal' /tmp/nexverse-chatgpt-citizen.md
          grep -F 'admin:* gehoeren nicht in das Buergerportal' /tmp/nexverse-chatgpt-citizen.md
          grep -F 'Viewer-CAPS' /tmp/nexverse-chatgpt-citizen.md

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/chatgpt-admin.md > /tmp/nexverse-chatgpt-admin.md
          grep -F 'ChatGPT Anweisung Adminbereich' /tmp/nexverse-chatgpt-admin.md
          grep -F 'Administrative Mutationen nur mit ausdruecklicher Benutzerabsicht' /tmp/nexverse-chatgpt-admin.md
          grep -F 'experiences:viewer:permissions' /tmp/nexverse-chatgpt-admin.md
          grep -F 'experiences:viewer:manage' /tmp/nexverse-chatgpt-admin.md

          # Validate the actual server-generated Markdown, not merely source
          # markers: every documented full-index path must equal the running
          # server OpenAPI, and citizen/admin indexes must respect audiences.
          curl --silent --fail --max-time 5 \
            http://127.0.0.1:19090/api/v1/openapi.json \
            > /tmp/nexverse-chatgpt-openapi.json
          python3 "$GITHUB_WORKSPACE/tools/ci/verify_worldapi_chatgpt_runtime.py" \
            --openapi /tmp/nexverse-chatgpt-openapi.json \
            --all /tmp/nexverse-chatgpt.md \
            --citizen /tmp/nexverse-chatgpt-citizen.md \
            --admin /tmp/nexverse-chatgpt-admin.md


  ledger-db-matrix:
    name: NV dollar live database matrix
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ledgerroot
          MARIADB_DATABASE: ogl_ledger_ci
          MARIADB_USER: ledger
          MARIADB_PASSWORD: ledgerpass
        ports:
          - 33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ogl_ledger_ci
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledgerpass
        ports:
          - 35432:5432
        options: >-
          --health-cmd="pg_isready -U ledger -d ogl_ledger_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify bundled database providers
        shell: bash
        run: |
          test -f bin/MySql.Data.dll
          test -f bin/Npgsql.dll

      - name: Run live NV dollar ledger matrix
        shell: bash
        env:
          NEX_LEDGER_MARIADB: "Data Source=127.0.0.1;Port=33306;Database=ogl_ledger_ci;User ID=ledger;Password=ledgerpass;Old Guids=true;SslMode=None;"
          NEX_LEDGER_POSTGRESQL: "Host=127.0.0.1;Port=35432;Database=ogl_ledger_ci;Username=ledger;Password=ledgerpass;SSL Mode=Disable;"
        run: dotnet run --configuration Release --project tools/ci/NexLedgerSqlMatrixRegression/NexLedgerSqlMatrixRegression.csproj

      - name: Run real MariaDB NexPortalIM archive regression
        shell: bash
        env:
          NEX_PORTAL_IM_MARIADB: "Data Source=127.0.0.1;Port=33306;Database=ogl_ledger_ci;User ID=ledger;Password=ledgerpass;Old Guids=true;SslMode=None;"
        run: dotnet run --configuration Release --project tools/ci/NexPortalImMariaDbRegression/NexPortalImMariaDbRegression.csproj

      - name: Run real MariaDB NexGroups authorization and invitation regression
        shell: bash
        env:
          NEX_GROUPS_MARIADB: "Data Source=127.0.0.1;Port=33306;Database=ogl_ledger_ci;User ID=ledger;Password=ledgerpass;Old Guids=true;SslMode=None;"
        run: |
          chmod +x runprebuild.sh
          ./runprebuild.sh
          dotnet run --configuration Release --project tools/ci/NexGroupsSqlAuthorizationRegression/NexGroupsSqlAuthorizationRegression.csproj

      - name: Run signed bearer HTTP NexGroups authorization regression
        shell: bash
        env:
          NEX_GROUPS_MARIADB: "Data Source=127.0.0.1;Port=33306;Database=ogl_ledger_ci;User ID=ledger;Password=ledgerpass;Old Guids=true;SslMode=None;"
        run: dotnet run --configuration Release --project tools/ci/NexGroupsHttpRegression/NexGroupsHttpRegression.csproj
