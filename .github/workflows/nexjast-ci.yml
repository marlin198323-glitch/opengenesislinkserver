name: NexVerse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NexVerse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)obj/' >/dev/null; then
            echo "::error::Tracked obj/ build intermediates found."
            git ls-files | grep -E '(^|/)obj/'
            exit 1
          fi

          forbidden_paths=(
            "OpenSim/ApplicationPlugins/RemoteController"
            "OpenSim/Region/OptionalModules/Avatar/Voice/VivoxVoice"
            "OpenSim/Region/OptionalModules/Avatar/Voice/FreeSwitchVoice"
            "OpenSim/Region/OptionalModules/ServiceConnectorsIn/Freeswitch"
            "OpenSim/Server/Handlers/Freeswitch"
            "OpenSim/Services/Connectors/Freeswitch"
            "OpenSim/Services/FreeswitchService"
            "OpenSim/Region/OptionalModules/Avatar/Chat/IRCBridgeModule.cs"
            "OpenSim/Region/OptionalModules/Avatar/Chat/IRCConnector.cs"
            "OpenSim/Server/Handlers/Authentication/OpenIdServerConnector.cs"
            "OpenSim/Server/Handlers/Authentication/OpenIdServerHandler.cs"
            "OpenSim/Region/OptionalModules/UserStatistics"
            "OpenSim/Region/OptionalModules/Example"
          )

          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "::error::Legacy component still exists: $path"
              exit 1
            fi
          done

          test -f OpenSim/Region/CoreModules/Scripting/XMLRPC/XMLRPCModule.cs
          test -f OpenSim/Region/OptionalModules/Scripting/XmlRpcRouterModule/XmlRpcRouterModule.cs

      - name: Verify immutable stable release gating on development main
        shell: bash
        run: python3 tools/ci/verify_stable_release_gate.py

      - name: Test fail-closed OpenGenesisLINK 0.9.3.10 release evidence gate
        shell: bash
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_verify_09310_release_readiness.py' -v
          python3 -m unittest discover -s tools/diagnostics -p 'test_ogl_09310_operator_preflight.py' -v
          # Do not invoke an empty operator manifest as a simulated PASS:
          # the real RC1/Stable evidence check is a separate manual gate.

      - name: Regression-test 0.9.3.12 RC1 release evidence gate
        shell: bash
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_09312_release_gate.py' -v
          # A blank manifest MUST NOT be accepted as an RC1 sign-off.
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          python3 tools/release/ogl_09312_gate.py init --manifest "$directory/manifest.json"
          python3 tools/release/ogl_09312_gate.py inventory --manifest "$directory/manifest.json"
          if python3 tools/release/ogl_09312_gate.py rc1 --manifest "$directory/manifest.json"; then
            echo "::error::0.9.3.12 RC1 gate accepted empty evidence"
            exit 1
          fi

      - name: Verify OpenGenesisLINK protected admin Control Center
        shell: bash
        run: python3 tools/ci/verify_ogl_docs_admin_ui.py

      - name: Verify OpenGenesisLINK 0.9.3.12 dashboard and diagnostic updates
        shell: bash
        run: python3 tools/ci/verify_ogl_worldapi_09312_ux.py

      - name: Verify Hypergrid friend online status after reconnect
        shell: bash
        run: python3 tools/ci/verify_hg_friends_reconnect_09312.py

      - name: Verify Feature Control node-specific policy routing
        shell: bash
        run: python3 tools/ci/verify_ogl_feature_policy_routing.py

      - name: Verify temporary legacy HG inventory opt-in and fail-closed default
        shell: bash
        run: python3 tools/ci/verify_hg_inventory_security_09312.py

      - name: Security - remote asset deletion must be absent
        shell: bash
        run: python3 tools/ci/verify_no_remote_asset_delete_09312.py

      - name: Verify LevelUpload precedence for UDP and CAPS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_asset_upload_level_consistency.py
          dotnet run --configuration Release --project tools/ci/AssetUploadLevelRegression/AssetUploadLevelRegression.csproj

      - name: Verify runtime secrets are not committed
        shell: bash
        run: python3 tools/ci/verify_no_plaintext_runtime_secrets.py

      - name: Verify runtime environment expansion declarations
        shell: bash
        run: python3 tools/ci/verify_environment_expansions.py

      - name: Verify enabled Experiences and NexBus deployment profile
        shell: bash
        run: |
          python3 tools/ci/verify_experiences_nexbus_enabled.py

      - name: OGL LSL 0.9.3.11 contract inventory and regression
        shell: bash
        run: |
          mkdir -p /tmp/ogl-lsl-parity
          python3 tools/lsl/lsl_matrix.py --verify --output /tmp/ogl-lsl-parity/lsl-matrix.json
          python3 -m unittest discover -s tools/ci -p 'test_lsl_matrix.py' -v

