      - name: Runtime smoke test World API
        shell: bash
        run: |
          set -euo pipefail
          cd bin

          dotnet Robust.dll -inifile Robust.NexVerseApi.Tests.ini > ../nexverse-api-smoke.log 2>&1 &
          ROBUST_PID=$!

          cleanup() {
            kill "$ROBUST_PID" 2>/dev/null || true
            wait "$ROBUST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          # Robust startup time varies on shared CI runners after full native builds.
          # Give the control plane 30 seconds while still failing immediately if the process exits.
          for i in $(seq 1 120); do
