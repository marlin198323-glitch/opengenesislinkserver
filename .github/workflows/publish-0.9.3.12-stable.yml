name: Publish OpenGenesisLINK 0.9.3.12 Stable

# Publish only the exact successful push-to-main CI SHA, with security hotfix.
# The operator requested an early GitHub release on 2026-10-14 while the
# separately documented 22-case live acceptance evidence remains incomplete.
on:
  workflow_run:
    workflows: ["NexVerse CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable 0.9.3.12 release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify 0.9.3.12 release and HG security gates
        id: release_check
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          grep -Fq 'public const string ProductName = "OpenGenesisLINK";' OpenSim/Framework/VersionInfo.cs
          grep -Fq 'public const string VersionNumber = "0.9.3.12";' OpenSim/Framework/VersionInfo.cs
          grep -Fq 'public const string AssemblyVersionNumber = "0.9.3.12";' OpenSim/Framework/VersionInfo.cs
          grep -Fq 'public const Flavour VERSION_FLAVOUR = Flavour.Release;' OpenSim/Framework/VersionInfo.cs
          test -s doc/NexVerse/RELEASE_0.9.3.12.md
          test -s doc/OpenGenesisLINK/09312_HG_INVENTORY_SECURITY.md
          grep -Fq 'm_DenyPublicHypergridInventory' OpenSim/Server/Handlers/Inventory/XInventoryInConnector.cs
          grep -Fq 'HttpStatusCode.Forbidden' OpenSim/Server/Handlers/Inventory/XInventoryInConnector.cs
          python3 tools/ci/verify_hg_inventory_security_09312.py
          test -s tools/release/ogl_09312_gate.py
          grep -Fq 'vollständigen 22-Fälle-Stable-Abnahme' doc/NexVerse/RELEASE_0.9.3.12.md
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Publish without rewriting existing tags or releases
        if: steps.release_check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.9.3.12"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$main_sha" != "$RELEASE_SHA" ]; then
            echo "::notice::main moved; refuse to release an outdated SHA."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "0.9.3.12 release already exists; no overwrite."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag already exists without a release; refusing to reuse."
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "OpenGenesisLINK 0.9.3.12" \
            --notes-file doc/NexVerse/RELEASE_0.9.3.12.md \
            --latest
