name: OGL AssetService Cache and Migration Tests
on:
  push:
    branches: [feature/ogl-assetservice-addon]
    paths:
      - 'addons/OGLAssetService/**'
      - 'addons/OGLAssetService.Tests/**'
      - 'addons/OGLAssetService.Migration/**'
      - '.github/workflows/ogl-assetservice-tests.yml'
  pull_request:
    paths:
      - 'addons/OGLAssetService/**'
      - 'addons/OGLAssetService.Tests/**'
      - 'addons/OGLAssetService.Migration/**'
      - '.github/workflows/ogl-assetservice-tests.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ogl-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ogl-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build isolated cache and migration tests
        run: dotnet build addons/OGLAssetService.Tests/OGLAssetService.Tests.csproj --configuration Release
      - name: Build standalone migration CLI
        run: dotnet build addons/OGLAssetService.Migration/OGLAssetService.Migration.csproj --configuration Release
      - name: CLI dry-run and verified copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fsassets-source/nested"
          printf 'test-asset' > "$RUNNER_TEMP/fsassets-source/nested/data.bin"
          dotnet run --project addons/OGLAssetService.Migration/OGLAssetService.Migration.csproj -c Release --no-build -- "$RUNNER_TEMP/fsassets-source" "$RUNNER_TEMP/fsassets-target"
          test ! -e "$RUNNER_TEMP/fsassets-target"
          dotnet run --project addons/OGLAssetService.Migration/OGLAssetService.Migration.csproj -c Release --no-build -- "$RUNNER_TEMP/fsassets-source" "$RUNNER_TEMP/fsassets-target" --copy
          cmp "$RUNNER_TEMP/fsassets-source/nested/data.bin" "$RUNNER_TEMP/fsassets-target/nested/data.bin"
      - name: Verify metadata audit CLI requires row count
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata-empty"
          : > "$RUNNER_TEMP/metadata-empty.tsv"
          if dotnet run --project addons/OGLAssetService.Migration/OGLAssetService.Migration.csproj -c Release --no-build -- --verify-metadata "$RUNNER_TEMP/metadata-empty" "$RUNNER_TEMP/metadata-empty.tsv"; then
            echo "ERROR: audit accepted missing expected row count"
            exit 1
          fi
          if dotnet run --project addons/OGLAssetService.Migration/OGLAssetService.Migration.csproj -c Release --no-build -- --verify-metadata "$RUNNER_TEMP/metadata-empty" "$RUNNER_TEMP/metadata-empty.tsv" --expected-rows 1; then
            echo "ERROR: audit accepted incomplete export"
            exit 1
          fi
      - name: Verify metadata audit positive CLI path
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/metadata-valid"
          mkdir -p "$base"
          printf 'ogl-metadata-fixture' > "$RUNNER_TEMP/asset-payload"
          hash="$(sha256sum "$RUNNER_TEMP/asset-payload" | cut -d ' ' -f 1)"
          folder="$base/${hash:0:2}/${hash:2:2}/${hash:4:2}/${hash:6:4}"
          mkdir -p "$folder"
          cp "$RUNNER_TEMP/asset-payload" "$folder/$hash"
          printf '123e4567-e89b-12d3-a456-426614174000\t%s\n' "$hash" > "$RUNNER_TEMP/metadata-valid.tsv"
          dotnet run --project addons/OGLAssetService.Migration/OGLAssetService.Migration.csproj -c Release --no-build -- --verify-metadata "$base" "$RUNNER_TEMP/metadata-valid.tsv" --expected-rows 1
      - name: SQL metadata roundtrip MariaDB
        env:
          MYSQL_PWD: ogl-test-only
        run: bash addons/OGLAssetService.Migration/test-sql-roundtrip.sh mysql
      - name: SQL metadata roundtrip PostgreSQL
        env:
          PGPASSWORD: ogl-test-only
        run: bash addons/OGLAssetService.Migration/test-sql-roundtrip.sh postgres
      - name: Run isolated cache and migration tests
        run: dotnet run --project addons/OGLAssetService.Tests/OGLAssetService.Tests.csproj --configuration Release --no-build
